name: Release jar

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: fqe-gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle') }}
          restore-keys: |
            fqe-gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build and publish to GitHub Packages
        run: |
          chmod +x gradlew
          VER="${GITHUB_REF_NAME#v}"
          ./gradlew jar publish --no-daemon --build-cache -Pmod_version="$VER"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Gradle caches
        if: success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: fqe-gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle') }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/ftb-quest-export-*.jar
          generate_release_notes: true
